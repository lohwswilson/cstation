name: Build & Push Docker Images

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Image recipe name (e.g. synercatalyst-odoo.18.0 or all)'
        required: true
        default: 'all'

jobs:
  build-odoo18:
    name: Build synercatalyst-odoo.18.0
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.image_name == 'all' || github.event.inputs.image_name == 'synercatalyst-odoo.18.0'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Odoo 18.0
        uses: docker/build-push-action@v5
        with:
          context: images/synercatalyst-odoo.18.0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            synercatalyst/odoo.18.0:latest
            synercatalyst/odoo.18.0:18.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-odoo13:
    name: Build synercatalyst-odoo.13.0
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.image_name == 'all' || github.event.inputs.image_name == 'synercatalyst-odoo.13.0'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Odoo 13.0
        uses: docker/build-push-action@v5
        with:
          context: images/synercatalyst-odoo.13.0
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            synercatalyst/odoo.13.0:latest
            synercatalyst/odoo.13.0:13.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
