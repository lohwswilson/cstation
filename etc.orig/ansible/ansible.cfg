[defaults]
# Inventory file location (relative to this config file)
inventory = /etc/cstation/ansible/inventory

# Vault password file (uncomment and create this file with your vault password)
# vault_password_file = .vault_pass

# Host key checking (disabled for easier development)
host_key_checking = False

# Default remote user
remote_user = ansible

# Roles path
roles_path = roles

# Collections path
collections_path = collections

# Retry files (disabled to avoid clutter)
retry_files_enabled = False

# Gathering facts (smart gathering for better performance)
gathering = smart

# Fact caching (memory caching for better performance)
fact_caching = memory
fact_caching_timeout = 86400

# Display settings
display_skipped_hosts = False
display_ok_hosts = True

# Callback plugins for better output
stdout_callback = yaml
bin_ansible_callbacks = True

# Pipelining for better performance
pipelining = True

# SSH timeout
timeout = 30

# Deprecation and warning settings
deprecation_warnings = True
action_warnings = True
command_warnings = True
system_warnings = True

# Python interpreter discovery
interpreter_python = auto_silent

[inventory]
# Enable inventory plugins
enable_plugins = host_list, script, auto, yaml, ini, toml

[privilege_escalation]
# Become settings
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection settings with optimizations
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
control_path_dir = ~/.ansible/cp
control_path = %(directory)s/%%h-%%p-%%r
pipelining = True
retries = 3

[persistent_connection]
# Persistent connection settings
command_timeout = 30
connect_timeout = 30
connect_retry_timeout = 15
connect_interval = 1

[colors]
# Color settings for better output readability
highlight = white
verbose = blue
warn = bright purple
error = red
debug = dark gray
deprecate = purple
skip = cyan
unreachable = red
ok = green
changed = yellow
diff_add = green
diff_remove = red
diff_lines = cyan
