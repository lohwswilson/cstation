github:
  username: "lohwswilson"
  default_clone_method: "ssh"  # or "https"
  default_directory: "./etc/github"
  organization: "ansis-ai"  # Default organization for repositories

repositories:

  - name: "Muk"
    description: "Muk-it Odoo Modules"
    url: https://github.com/muk-it/odoo-modules.git
    branch: 17.0
    local_path: "/opt/PW/PW_ADDONS.7.0/OCA"
    includes:
      - muk_web_theme
      - muk_product
      - muk_web_colors
      - muk_web_appsbar
      - muk_web_dialog
      - muk_web_chatter

  - name: "queue"
    description: "OCA Queue"
    url: https://github.com/OCA/queue.git
    branch: 17.0
    local_path: "/opt/PW/PW_ADDONS.7.0/OCA"
    includes:
      - queue_job
      - queue_job_cron_jobrunner

  - name: "server-tools"
    description: "OCA Server Tools"
    url: https://github.com/OCA/server-tools.git
    branch: 17.0
    local_path: "/opt/PW/PW_ADDONS.7.0/OCA"
    includes:
        - auto_backup
        - database_cleanup
        - upgrade_analysis
        - views_migration_17

  - name: "web"
    description: "OCA Web"
    url: https://github.com/OCA/web.git
    branch: 17.0
    local_path: "/opt/PW/PW_ADDONS.7.0/OCA"
    includes:
      - web_refresher


  - name: "CybroAddons"
    description: "Cybro Addons"
    url: https://github.com/CybroOdoo/CybroAddons.git
    branch: 17.0
    local_path: "/opt/PW/PW_ADDONS.7.0/OCA"
    includes:
      - base_accounting_kit
      - base_account_budget
      - base_advanced_report_templates
      - dynamic_accounts_report
      - sales_order_delivery_status
