# Traefik Reverse Proxy Profile
# Modern reverse proxy and load balancer with automatic service discovery

description: "Traefik reverse proxy with automatic SSL certificates and service discovery for containerized applications"

# Container Configuration
containers:
  traefik:
    name: "traefik"
    image: "traefik:latest"
    ports:
      - "80:80"     # HTTP
      - "443:443"   # HTTPS
      - "8080:8080" # Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "{{ traefik_data_path }}/traefik.yml:/traefik.yml:ro"
      - "{{ traefik_data_path }}/acme.json:/acme.json"
      - "{{ traefik_data_path }}/dynamic:/dynamic:ro"
    environment:
      TRAEFIK_API_DASHBOARD: "{{ traefik_dashboard_enabled | string }}"
      TRAEFIK_API_INSECURE: "{{ traefik_api_insecure | string }}"
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
      TRAEFIK_PROVIDERS_DOCKER: "true"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: "{{ ssl_email }}"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_STORAGE: "/acme.json"
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_HTTPCHALLENGE_ENTRYPOINT: "web"
    networks:
      - "{{ traefik_network.name }}"
    restart_policy: "unless-stopped"
    labels:
      description: "Traefik Reverse Proxy and Load Balancer"
      version: "v3.0"
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: "Host(`{{ traefik_domain }}`)"
      traefik.http.routers.traefik.tls: "true"
      traefik.http.routers.traefik.tls.certresolver: "letsencrypt"
      traefik.http.services.traefik.loadbalancer.server.port: "8080"
      # Global HTTP to HTTPS redirect
      traefik.http.routers.http-catchall.rule: "hostregexp(`{host:.+}`)"
      traefik.http.routers.http-catchall.entrypoints: "web"
      traefik.http.routers.http-catchall.middlewares: "redirect-to-https"
      traefik.http.middlewares.redirect-to-https.redirectscheme.scheme: "https"

# Docker networks
docker_networks:
  - name: "{{ traefik_network.name }}"
    driver: "bridge"
    ipam:
      config:
        - subnet: "{{ traefik_network.subnet }}"
          gateway: "{{ traefik_network.gateway }}"

# Configuration files
configurations:
  - src: traefik/traefik.yml.j2
    dest: "{{ traefik_data_path }}/traefik.yml"
  - src: traefik/acme.json.j2
    dest: "{{ traefik_data_path }}/acme.json"
    mode: '0600'

# Pre-deployment tasks
pre_deploy_tasks:
  - name: "Create Traefik data directory"
    file:
      path: "{{ traefik_data_path }}/dynamic"
      state: directory
      mode: '0755'

# Environment variables
environment_variables:
  TRAEFIK_DOMAIN: "{{ traefik_domain }}"
  TRAEFIK_DASHBOARD_ENABLED: "{{ traefik_dashboard_enabled | default('true') }}"
  TRAEFIK_API_INSECURE: "{{ traefik_api_insecure | default('false') }}"
  SSL_EMAIL: "{{ ssl_email }}"
  DOCKER_HOST: "unix:///var/run/docker.sock"



# Default variables that can be overridden in host_vars
vars:
  # Domain and SSL Configuration
  domain_name: "traefik.localhost"
  ssl_email: "syner.catalyst@gmail.com"
  ssl_enabled: true
  
  # Traefik Configuration
  traefik_domain: "{{ domain_name }}"
  traefik_dashboard_enabled: true
  traefik_api_insecure: false  # Set to true for development only
  traefik_data_path: "/opt/traefik"
  docker_log_max_size: "10m"
  docker_log_max_file: "3"
  
  # Network Configuration
  traefik_network:
    name: "ANSIS_NET"
    subnet: "172.21.0.0/16"
    gateway: "172.21.0.1"
  