# Portainer Container Management Profile
# Minimal profile for deploying Portainer container management interface

description: "Lightweight profile for Portainer container management interface with minimal software dependencies"

# Container Configuration
containers:
  portainer:
    name: "portainer"
    image: "portainer/portainer-ce:latest"
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "{{ portainer_data_path }}:/data"
    environment:
      PORTAINER_ADMIN_PASSWORD: "{{ portainer_admin_password }}"
      PORTAINER_DOMAIN: "{{ portainer_domain }}"
      PORTAINER_SSL_ENABLED: "{{ portainer_ssl_enabled | string }}"
    networks:
      - "{{ portainer_network.name }}"
    restart_policy: "unless-stopped"
    labels:
      description: "Portainer Container Management Interface"
      version: "latest"
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: "Host(`{{ portainer_domain }}`)"
      traefik.http.routers.portainer.tls: "true"
      traefik.http.routers.portainer.tls.certresolver: "letsencrypt"
      traefik.http.services.portainer.loadbalancer.server.port: "9000"

# Docker networks
docker_networks:
  - name: "{{ portainer_network.name }}"
    driver: "bridge"
    ipam:
      config:
        - subnet: "{{ portainer_network.subnet }}"
          gateway: "{{ portainer_network.gateway }}"

# Configuration files
configurations:
  - src: docker/daemon.json.j2
    dest: /etc/docker/daemon.json

# Environment variables
environment_variables:
  PORTAINER_ADMIN_PASSWORD: "{{ portainer_admin_password | default('admin123') }}"
  PORTAINER_LOGO: "https://portainer.io/images/logos/portainer.png"
  PORTAINER_DOMAIN: "{{ portainer_domain }}"
  PORTAINER_SSL_ENABLED: "{{ portainer_ssl_enabled | string }}"
  DOCKER_HOST: "unix:///var/run/docker.sock"

# Post-installation tasks
post_install_tasks:
  - name: "Set Docker to start on boot"
    systemd:
      name: docker
      enabled: yes

# Default variables that can be overridden in host_vars
vars:
  # Domain and SSL Configuration
  domain_name: "portainer.eu1.ansis.com.sg"
  ssl_email: "admin@localhost"
  ssl_enabled: false

  # Portainer Configuration
  portainer_admin_password: "admin123" # Change this in production
  portainer_domain: "{{ domain_name }}"
  portainer_ssl_enabled: "{{ ssl_enabled }}"
  portainer_data_path: "/opt/portainer/data"
  docker_log_max_size: "10m"
  docker_log_max_file: "3"

  # Network Configuration
  portainer_network:
    name: "ANSIS_NET"
    subnet: "172.20.0.0/16"
    gateway: "172.20.0.1"
