---
  - hosts: all
    become: yes

    tasks:
      - name: Create PW_NET network
        docker_network:
          name: PW_NET

      # - name: Install Both CAdvisor and NodeExporter Containers for Prometheus 
      #  command: "{{ item }}"
      #  with_items: 
      #        - docker run -d --volume=/:/rootfs:ro --volume=/var/run:/var/run:ro --volume=/sys:/sys:ro --volume=/var/lib/docker/:/var/lib/docker:ro --volume=/dev/disk/:/dev/disk:ro --publish=8080:8080 --name={{ inventory_hostname|upper}}_CADVISOR google/cadvisor:latest
      #        - docker run -d --name {{ inventory_hostname|upper}}_NODE_EXPORTER -p 9100:9100 prom/node-exporter

      - name: Install Flowise Docker Container 
        docker_container:
          name: "{{ inventory_hostname|upper}}_FLOWISE"
          image: synercatalyst/flowise:latest
          state: started
          restart: yes
          pull: True
          restart_policy: always
          ports:
            - 3000:3000
          networks:
              - name: PW_NET
          networks_cli_compatible: yes
          env:
              OPENAI_API_KEY: "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"
          volumes:
            - "/var/lib/LLM/{{ inventory_hostname|upper }}/CONTAINERS/FLOWISE/data:/data"
          labels:
              traefik.enable=true
              traefik.http.routers.{{ inventory_hostname|upper }}_FLOWISE.rule=Host(`flowise.perfectwork.app`)
              traefik.http.routers.{{ inventory_hostname|upper }}_FLOWISE.tls=true
              traefik.http.routers.{{ inventory_hostname|upper }}_FLOWISE.tls.certresolver=le_resolver
              traefik.http.routers.{{ inventory_hostname|upper }}_FLOWISE.service= {{ inventory_hostname|upper }}_FLOWISE
              traefik.http.services.{{ inventory_hostname|upper }}_FLOWISE.loadbalancer.server.port=3000 
              traefik.http.middlewares.{{ inventory_hostname|upper }}_FLOWISE.compress=true

           