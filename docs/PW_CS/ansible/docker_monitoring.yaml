---
  - hosts: all
    become: yes

    tasks:

      - name: Install PostgreSQL_Exporter Containers for Prometheus 
        docker_container:
          name: "{{ inventory_hostname|upper}}_POSTGRESQL_EXPORTER"
          image: wrouesnel/postgres_exporter
          state: started
          restart: yes
          restart_policy: always
          networks:
            - name: PW_NET
          networks_cli_compatible: yes
          ports:
            - 9187:9187
          env:
            DATA_SOURCE_NAME: "postgresql://postgres:wai39kua@{{inventory_hostname}}.synercatalyst.com:1488/?sslmode=disable"
            PG_EXPORTER_AUTO_DISCOVER_DATABASES : "true"

     