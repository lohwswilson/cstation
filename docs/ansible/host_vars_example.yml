# Example host_vars file for PgAdmin container deployment
# This file should be placed in /etc/ansible/inventory/host_vars/<hostname>.yml
# Replace <hostname> with your actual server hostname

# PgAdmin Container Configuration
pgadmin:
  container_name: "{{ inventory_hostname|upper }}_PGADMIN"
  image: "dpage/pgadmin4:latest"
  port: "5050"
  network_name: "PW_NET"
  
  # Volume configurations
  data_volume: "/var/lib/perfectwork/{{ inventory_hostname|upper }}/DB/{{ inventory_hostname|upper }}_PGADMIN"
  servers_config: "/tmp/servers.json"
  
  # Credentials (should be encrypted with ansible-vault)
  default_email: "pgadmin@synercatalyst.com"
  default_password: "{{ vault_pgadmin_password }}"  # Use vault for sensitive data
  
  # Traefik configuration
  traefik:
    enable: "true"
    certresolver: "le_resolver"
    host: "pgadmin.synercatalyst.com"
    service_port: "80"

# Example of how to encrypt sensitive variables:
# 1. Create a vault file: ansible-vault create /etc/ansible/inventory/host_vars/<hostname>/vault.yml
# 2. Add sensitive variables:
#    vault_pgadmin_password: "your_secure_password_here"
# 3. Reference vault variables in your host_vars file as shown above

# Directory structure example:
# /etc/ansible/inventory/
# ├── hosts.yml
# ├── group_vars/
# │   └── all.yml
# └── host_vars/
#     ├── server1.yml
#     ├── server2.yml
#     └── server1/
#         └── vault.yml  # encrypted sensitive data