# GitHub Repositories Configuration
# Based on repo_example.yml with enhanced details

github:
  username: "lohwswilson"
  default_clone_method: "ssh"  # or "https"
  default_directory: "./etc/github"
  organization: "ansis-ai"  # Default organization for repositories

repositories:
  # Odoo Repositories
  - name: "odoo-18"
    description: "Odoo ERP System - Main Repository"
    clone_method: "ssh"
    auto_sync: true
    local_path: "/opt/PW/PW.18.0"
    branch: "18.0"
    upstream_url: "https://github.com/odoo/odoo.git"
    fork_url: "git@github.com:ansis-ai/odoo"
    category: "erp"
    
  - name: "odoo-17"
    description: "Odoo ERP System - Version 17.0"
    clone_method: "ssh"
    auto_sync: true
