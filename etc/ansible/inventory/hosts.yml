---
# Ansible Inventory Configuration
# This file defines the infrastructure hosts and their configurations
# Sensitive data should be stored in vault files or environment variables

# =============================================================================
# PRODUCTION ENVIRONMENTS
# =============================================================================

# ANSIS Singapore Infrastructure
ANSIS_SGP:
  vars:
    # Connection settings
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    
    # Database configuration
    postgresql_db_admin: postgres
    postgresql_db_password: "{{ vault_postgresql_password }}"
    postgresql_port: 1488
    
    # Network configuration
    odoo_pw_network: odoo_pw_network
    
  hosts:
    sg05:
      ansible_host: sg05.ansis.com.sg
      # Container naming
      traefik_container: SG05_TRAEFIK
      portainer_container: SG05_PORTAINER
      postgresql_container: SG05DB
      # Database specific
      postgresql_docker_image: postgres:16
      postgresql_config_file: postgresql.auto.conf_16GB.j2
      
    sg06:
      ansible_host: sg06.ansis.com.sg
      # Container naming
      traefik_container: SG06_TRAEFIK
      portainer_container: SG06_PORTAINER
      postgresql_container: SG06_DB
      
    eu01:
      ansible_host: eu01.ansis.com.sg
      # Container naming
      traefik_container: EU01_TRAEFIK
      portainer_container: EU01_PORTAINER
      postgresql_container: EU01_DB

# Synercatalyst USA Infrastructure
SYC_USA:
  vars:
    # Connection settings
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_port: 8288
    
    # Database configuration
    postgresql_db_admin: postgres
    postgresql_db_password: "{{ vault_postgresql_password }}"
    postgresql_port: 1488
    
    # Network configuration
    docker_PW_network: PW_NET
    
  hosts:
    us01:
      ansible_host: us01.synercatalyst.com
      # Container naming
      nginx_container: US01_NGINX
      portainer_container: US01_PORTAINER
      postgresql_container: US01_DB
      # Database specific
      postgresql_docker_image: postgres:12

# Synercatalyst Singapore Infrastructure
SYC_SGP:
  vars:
    # Connection settings
    ansible_user: root
    ansible_python_interpreter: /usr/bin/python3
    ansible_port: 8288
    
    # Database configuration
    postgresql_db_admin: postgres
    postgresql_db_password: "{{ vault_postgresql_password }}"
    postgresql_port: 1488
    
    # Network configuration
    docker_PW_network: PW_NET
    
  hosts:
    sg01:
      ansible_host: sg01.synercatalyst.com
      # Container naming
      traefik_container: SG01_TRAEFIK
      portainer_container: SG01_PORTAINER
      postgresql_container: SG01_DB
      # Traefik configuration
      traefik_pilot_token: "{{ vault_traefik_pilot_token_sg01 }}"
      # Database specific
      postgresql_docker_image: postgres:14
      postgresql_version: 14
      postgresql_config_file: postgresql.auto.conf_16GB.j2
      
    sg02:
      ansible_host: sg02.synercatalyst.com
      # Container naming
      traefik_container: SG02_TRAEFIK
      portainer_container: SG02_PORTAINER
      postgresql_container: SG02_DB
      # Traefik configuration
      traefik_pilot_token: "{{ vault_traefik_pilot_token_sg02 }}"
      # Database specific
      postgresql_docker_image: postgres:12
      
    sg04:
      ansible_host: sg04.synercatalyst.com
      # Container naming
      traefik_container: SG04_TRAEFIK
      portainer_container: SG04_PORTAINER
      postgresql_container: SG04_DB
      # Database specific
      postgresql_docker_image: postgres:15
      postgresql_config_file: postgresql.auto.conf_16GB.j2

# =============================================================================
# DEVELOPMENT/LOCAL ENVIRONMENTS
# =============================================================================

LOCAL:
  vars:
    # Connection settings
    ansible_user: root
    ansible_port: 8288
    ansible_python_interpreter: /usr/bin/python3
    
    # Database configuration
    postgresql_port: 1488
    
  hosts:
    localhost:
      ansible_connection: local
      ansible_sudo_pass: "{{ vault_local_sudo_password }}"
      # Container naming
      portainer_container: LOCAL_PORTAINER
      # Database specific
      postgresql_docker_image: postgres:latest

# =============================================================================
# GROUP HIERARCHIES AND COMMON CONFIGURATIONS
# =============================================================================

# All production servers
production:
  children:
    ANSIS_SGP:
    SYC_USA:
    SYC_SGP:
  vars:
    # Common production settings
    environment: production
    backup_enabled: true
    monitoring_enabled: true

# All development/staging servers
development:
  children:
    LOCAL:
  vars:
    # Common development settings
    environment: development
    backup_enabled: false
    monitoring_enabled: false
    debug_mode: true

# All servers with PostgreSQL
postgresql_servers:
  children:
    ANSIS_SGP:
    SYC_USA:
    SYC_SGP:
    LOCAL:
  vars:
    # Common PostgreSQL settings
    postgresql_max_connections: 200
    postgresql_shared_buffers: 256MB
    postgresql_effective_cache_size: 1GB

# All servers with Traefik
traefik_servers:
  children:
    ANSIS_SGP:
    SYC_SGP:
  vars:
    # Common Traefik settings
    traefik_api_dashboard: true
    traefik_log_level: INFO
    traefik_metrics_enabled: true

# All servers with Portainer
portainer_servers:
  children:
    ANSIS_SGP:
    SYC_USA:
    SYC_SGP:
    LOCAL:
  vars:
    # Common Portainer settings
    portainer_admin_password: "{{ vault_portainer_admin_password }}"
    portainer_logo_url: ""