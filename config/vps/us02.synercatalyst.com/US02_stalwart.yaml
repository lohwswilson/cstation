apiVersion: cstation/v1
kind: Container
name: stalwart
enabled: true
image: stalwartlabs/stalwart:latest
container_name: US02_stalwart
network: PW_NET
ports:
  - "25:25"
  - "110:110"
  - "465:465"
  - "587:587"
  - "993:993"
  - "995:995"
  - "4190:4190"
volumes:
  - /var/lib/stalwart/etc:/etc/stalwart
  - /var/lib/stalwart/data:/var/lib/stalwart
env:
  STALWART_RECOVERY_ADMIN: "admin:REPLACE_ME"
secrets:
  - CF_API_EMAIL
  - CF_API_KEY
restart_policy: unless-stopped
owner: "2000:2000"
subdirs:
  - etc
  - data
ulimits:
  nofile:
    soft: 65536
    hard: 65536
traefik:
  http:
    routers:
      stalwart-admin:
        rule: "Host(`mail.perfectwork.app`) || Host(`mail.ansis.com.sg`)"
        entryPoints:
          - websecure
        service: stalwart-http
        tls:
          certResolver: le_dns_resolver
    services:
      stalwart-http:
        loadBalancer:
          servers:
            - url: "http://US02_stalwart:8080"