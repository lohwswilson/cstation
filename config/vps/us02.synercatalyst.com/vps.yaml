apiVersion: cstation/v1
kind: VPS
identity:
  name: us02.synercatalyst.com
  stage: prod
  region: Manassas
  provider: static
access:
  host: us02.synercatalyst.com
  user: root
  port: 22
facts:
  os:
    id: ubuntu
    version: '26.04'
    pretty: Ubuntu 26.04 LTS
    kernel: 7.0.0-15-generic
    package_manager: apt
  cpu:
    architecture: aarch64
    vendor: ARM
    model: Neoverse-N1
    vcpu: 6
    sockets: 6
    threads_per_core: 1
  memory:
    total_mb: 7908
    used_mb: 509
    available_mb: 7398
    swap_total_mb: 0
    swap_used_mb: 0
  disks:
  - name: sr0
    size_gb: 1.0
    type: rom
  - name: vda
    size_gb: 256.0
    type: disk
    partitions:
    - name: vda1
      size_gb: 0.2
      type: part
      mountpoint: /boot/efi
    - name: vda2
      size_gb: 1.0
      type: part
      mountpoint: /boot
    - name: vda3
      size_gb: 254.7
      type: part
      mountpoint: /
  network:
    interfaces:
    - name: eth0
      state: UP
      mac: 56:1d:1f:8e:88:bf
      ipv4: 152.53.169.95
      ipv4_prefix: 22
      ipv6: 2a0a:4cc0:2000:aebf:541d:1fff:fe8e:88bf
      ipv6_prefix: 64
    routes:
    - destination: default
      via: 152.53.168.1
      dev: eth0
    - destination: 152.53.168.0/22
      dev: eth0
  hostname: US02
  packages:
    detected:
    - openssh-server
    - ufw
    - nftables
    - python3
    - curl
    - git
    - sudo
    missing:
    - fail2ban
    - docker
    - docker.io
    - containerd
    - docker-compose-v2
    - rsync
os:
  hostname: us02.synercatalyst.com
  baseline:
    upgrade_all: true
    packages:
    - fail2ban
    - docker.io
    - containerd
    - docker-compose-v2
    - zsh
    - rsync
    shell: zsh
    terminal: xterm-256color
    swap:
      size_gb: 4
    tuning:
      vm_swappiness: 10
      vm_overcommit_memory: 1
      net_ipv4_tcp_max_syn_backlog: 1024
      fs_inotify_max_user_watches: 524288
      net_ipv4_tcp_keepalive_time: 600
    sshd:
      disable_password_auth: true
    fail2ban:
      bantime: 1h
      findtime: 10m
      maxretry: 5
    firewall:
      mode: ufw
      allow:
      - 22/tcp
      - 80/tcp
      - 443/tcp
      - 25/tcp
      - 110/tcp
      - 465/tcp
      - 587/tcp
      - 993/tcp
      - 995/tcp
      - 4190/tcp
      - 8000/tcp
      - 9000/tcp
  journald:
    system_max_use: 500M
    forward_to_syslog: false
docker:
  daemon:
    log_driver: json-file
    log_opts:
      max_size: 10m
      max_file: "3"
    storage_driver: overlay2
    live_restore: true
    iptables: true
  networks:
  - PW_NET
  directories:
  - /var/lib/perfectwork