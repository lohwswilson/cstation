apiVersion: cstation/v1
kind: VPS
identity:
  name: eu01.synercatalyst.com
  stage: prod
  region: hel1
access:
  host: 37.27.218.255
  user: root
  port: 22
facts:
  os:
    id: ubuntu
    version: '24.04'
    pretty: Ubuntu 24.04.3 LTS
    kernel: 6.8.0-90-generic
    package_manager: apt
  cpu:
    architecture: aarch64
    vendor: ARM
    model: Neoverse-N1
    vcpu: 4
    cores_per_socket: 4
    sockets: 1
    threads_per_core: 1
  memory:
    total_mb: 7730
    used_mb: 344
    available_mb: 7385
    swap_total_mb: 0
    swap_used_mb: 0
  disks:
  - name: sda
    size_gb: 76.3
    type: disk
    partitions:
    - name: sda1
      size_gb: 76.0
      type: part
      mountpoint: /
    - name: sda14
      size_gb: 0.0
      type: part
    - name: sda15
      size_gb: 0.2
      type: part
      mountpoint: /boot/efi
  - name: sr0
    size_gb: 1.0
    type: rom
  network:
    interfaces:
    - name: eth0
      state: UP
      mac: 92:00:07:a4:c8:ef
      ipv4: 37.27.218.255
      ipv4_prefix: 32
      ipv6: 2a01:4f9:c014:760a::1
      ipv6_prefix: 64
    routes:
    - destination: default
      via: 172.31.1.1
      dev: eth0
    - destination: 172.31.1.1
      dev: eth0
    - destination: 185.12.64.1
      via: 172.31.1.1
      dev: eth0
    - destination: 185.12.64.2
      via: 172.31.1.1
      dev: eth0
  hostname: EU01
  packages:
    detected:
    - openssh-server
    - ufw
    - nftables
    - python3
    - rsync
    - curl
    - git
    - sudo
    missing:
    - fail2ban
    - docker
    - docker.io
    - containerd
os:
  hostname: eu01.synercatalyst.com
  baseline:
    upgrade_all: true
    packages:
    - fail2ban
    - docker.io
    - containerd
    - docker-compose-v2
    - zsh
    shell: zsh
    terminal: xterm-256color
    swap:
      size_gb: 4
    tuning:
      vm_swappiness: 10
      vm_overcommit_memory: 1
      net_ipv4_tcp_max_syn_backlog: 1024
      fs_inotify_max_user_watches: 524288
      net_ipv4_tcp_keepalive_time: 600
    sshd:
      disable_password_auth: true
    fail2ban:
      bantime: 1h
      findtime: 10m
      maxretry: 5
    firewall:
      mode: ufw
      allow:
      - 22/tcp
      - 80/tcp
      - 443/tcp
      - 25/tcp
      - 110/tcp
      - 465/tcp
      - 587/tcp
      - 993/tcp
      - 995/tcp
      - 4190/tcp
      - 8000/tcp
      - 9000/tcp
  journald:
    system_max_use: 500M
    forward_to_syslog: false
docker:
  daemon:
    log_driver: json-file
    log_opts:
      max_size: 10m
      max_file: "3"
    storage_driver: overlay2
    live_restore: true
    iptables: true
  networks:
  - PW_NET
  directories:
  - /var/lib/perfectwork
