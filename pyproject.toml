[project]
name = "cstation"
version = "0.1.0"
description = "Infrastructure Management CLI for DevOps - A powerful tool for managing infrastructure using Ansible and Docker"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "DevOps Team", email = "devops@example.com"}
]
keywords = ["devops", "infrastructure", "ansible", "docker", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.16.0",
    "rich>=14.1.0",
    "pyyaml>=6.0",
    "psycopg2>=2.9.11",
    "pydantic>=2.12.3",
    "fabric>=3.2.2",
    "invoke>=2.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cstation = "cstation.main:main"

[project.urls]
Homepage = "https://github.com/example/cstation"
Repository = "https://github.com/example/cstation.git"
Issues = "https://github.com/example/cstation/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cstation"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.uv.workspace]
members = [
    "cstation-cli",
]
