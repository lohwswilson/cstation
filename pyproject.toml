[project]
name = "cstation"
version = "1.0.0"
description = "Infrastructure Management CLI for DevOps - A powerful tool for managing infrastructure using Ansible and Docker"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "WS Loh", email = "wsloh@perfectwork.com"}
]
keywords = ["devops", "infrastructure", "ansible", "docker", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.16.0",
    "click>=8.0.0",
    "rich>=14.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.12.3",
    "fabric>=3.2.2",
    "invoke>=2.2.1",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
cstation = "cstation.main:main"

[project.urls]
Homepage = "https://github.com/lohwswilson/cstation"
Repository = "https://github.com/lohwswilson/cstation.git"
Issues = "https://github.com/lohwswilson/cstation/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cstation"]

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".venv",
    "docs",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E741",
    "F841",
    "E402",
    "E722",
]
